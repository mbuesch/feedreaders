# -*- coding: utf-8 -*-

[workspace]
members = [
    "feeds",
    "feedscfg",
    "feedscli",
    "feedsd",
    "feedsdb",
]
resolver = "3"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-2.0-or-later"
authors = [ "Michael Büsch <m@bues.ch>", "Marco Lochen" ]
homepage = "https://bues.ch/"
repository = "https://github.com/mbuesch/feedreaders"
readme = "README.md"
categories = [ "network-programming", "text-processing", "visualization", "web-programming" ]
keywords = [ "feed-reader", "rss", "atom" ]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", default-features = false }
console-subscriber = "0.5"
env_logger = "0.11"
feed-rs = "3"
hex = "0.4"
html-escape = "0.3"
itertools = "0.15"
jiff = "1"
log = "0.4"
multer = "3"
nix = { version = "0.32", default-features = false }
querystrong = "0.4"
rand = "0.10"
regex = "1"
reqwest = { version = "0.13", default-features = false }
rusqlite = "0.43"
rustls = { version = "0.23", default-features = false }
sd-notify = "0.5"
sha2 = "0.11"
tokio = "1"
toml = "1"

feedscfg = { version = "1", path = "./feedscfg" }
feedsdb = { version = "1", path = "./feedsdb" }

[profile.dev]
debug = "limited"
panic = "abort"

[profile.release]
lto = "fat"
panic = "abort"
strip = "symbols"
overflow-checks = true

# vim: ts=4 sw=4 expandtab
